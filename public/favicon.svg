<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="eg-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312e81" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#eg-grad)" filter="url(#shadow)" />

  <!-- Inner Sparkles Knowledge Beacon -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 106) scale(12.5)">
    <!-- Primary Center Star -->
    <path d="M12 2.5 C12 7.7 16.3 12 21.5 12 C16.3 12 12 16.3 12 21.5 C12 16.3 7.7 12 2.5 12 C7.7 12 12 7.7 12 2.5 Z" fill="#ffffff" stroke="none" />
    <!-- Top-Right Sparkle -->
    <path d="M19 2v4" stroke="#ffffff" stroke-width="2.5" />
    <path d="M21 4h-4" stroke="#ffffff" stroke-width="2.5" />
    <!-- Bottom-Left Starlet -->
    <circle cx="5" cy="19" r="2" fill="#ffffff" stroke="none" />
